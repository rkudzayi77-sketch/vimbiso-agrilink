version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: vimbiso_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: vimbiso
      MONGO_INITDB_ROOT_PASSWORD: vimbiso2024
      MONGO_INITDB_DATABASE: vimbiso_agrilink
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - vimbiso_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vimbiso_api
    restart: always
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://vimbiso:vimbiso2024@mongodb:27017/vimbiso_agrilink?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-vimbiso_jwt_super_secret_change_in_prod_2024}
      JWT_EXPIRE: 30d
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - vimbiso_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: vimbiso_web
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - vimbiso_net

  nginx:
    image: nginx:alpine
    container_name: vimbiso_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - vimbiso_net

volumes:
  mongo_data:
  uploads_data:

networks:
  vimbiso_net:
    driver: bridge
