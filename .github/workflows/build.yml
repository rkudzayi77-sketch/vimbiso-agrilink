name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          cd frontend || cd.
          npm install
          npx expo prebuild || echo "no prebuild"
          cd android && chmod +x gradlew &&./gradlew assembleRelease ||./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vimbiso-APK
          path: "**/android/app/build/outputs/apk/**/*.apk"
