name: Build Vimbiso APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build React app
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://vimbiso-api.onrender.com' }}
        run: npm run build

      - name: Install Capacitor CLI
        working-directory: frontend
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vimbiso-agrilink-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Vimbiso AgriLink v${{ github.run_number }}
          body: |
            🌿 Vimbiso AgriLink — Zimbabwe's Informal Economy OS
            
            Built by CreatVate (Pvt) Ltd
            
            **Install:** Download vimbiso-agrilink.apk and install on Android
            **Demo logins (PIN: 1234):**
            - Buyer: +263771234561
            - Vendor: +263771234562  
            - Farmer: +263771234563
            - Delivery: +263771234564
            - Agent: +263771234565
            - Admin: +263771234566
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy backend to Render
        run: |
          echo "Backend auto-deploys via Render.com webhook"
          echo "Set RENDER_DEPLOY_HOOK in GitHub secrets for auto-deploy"
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" 2>/dev/null || true
